<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css " rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <br>
        <a class="navbar-brand">Skewer</a>
        <div class="links">
        <a href="sku.html">SKU Generator/a>
        <a href="index.html">ⓘ Receipt Generator</a>
        </div>
    </nav>

    <div class="container-round">
        <div class="card mx-auto" style="max-width: 550px">        
            <div class="title">
            <h2>☕️ OBMC ENTREP FAIR 🍽️</h2>
            </div>

            <div class="drink">
            <input type="checkbox" id="item1" value="99">

            <span >PHP 099</span> 
            </div>

            <div class="drink">
            <input type="checkbox" id="item2" value="129">
            <label>Spanish Latte</label>
            <span>PHP 129</span>
            </div>

            <div class="drink">
            <input type="checkbox" id="item3" value="189">
            <label>Cold Brew Malt</label>
            <span>PHP 189</span>
            </div>


            <div class="drink">
           <input type="checkbox" id="item4" value="159">
           <label>Affogato</label>
            <span>PHP 159</span>
            </div>  


            <div class="drink">
           <input type="checkbox" id="item5" value="129">
           <label>Caramel Macchiato</label>
            <span>PHP 129</span>
            </div>

            <div class="button">
           <button class="btn btn-success form-control" py-click="create_order">Create Order</button>
            </div>

            <div class="reminder">
           <h6>Your order summary will appear here.</h6>
            </div>

            <div id="show" class="result">
            </div>
    
    </div>
    </div>

    <script type="py" src="main.py"></script>
