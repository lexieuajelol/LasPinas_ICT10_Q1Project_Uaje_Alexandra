<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css " rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>

</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <br>
        <a class="navbar-brand">Skewer</a>
        <div class="links">
        <a href="sku.html">SKU GENERATOR</a>
        <a href="index.html">ⓘ Receipt Generator</a>
        </div>
    </nav>

    <div class="container-round">
        <div class="card mx-auto" style="max-width: 550px">        
            <div class="title">
            <h2>SKU GENERATOR</h2>
            </div>

            <div class="thecategory">
            <label>Category</label>
            <select name="Category" class="form-control" id="category">
            <option value="Perishable">Perishable</option>
            <option value="Non-Perishable">Non-Perishable</option>
            </select>
            </div>

            <div class="thecategory">
            <label>Product Name</label>
            <input type="text" class="form-control" id="product_name" placeholder="ex. Bottled Water">
            </div>

             <div class="thecategory">
            <label>Stock Quantity</label>
            <input type="number" class="form-control" id="quantity" placeholder="ex. 100">
            </div>

            <div class="button">
           <button class="btn btn-success form-control" py-click="SKU_generator">Generate SKU</button>
            </div>

            <div class="reminder">
           <h6>Your SKU will appear here.</h6>
            </div>

            <div id="output" class="result">
            </div>
    
    </div>
    </div>
    <script type="py" src="main.py"></script>
</body>
</html>
